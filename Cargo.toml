[package]
name = "aw-work-sync"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aw-work-sync"
path = "src/main.rs"

[dependencies]
aw-client-rust = { git = "https://github.com/ActivityWatch/aw-server-rust.git", branch = "master" }
aw-models = { git = "https://github.com/ActivityWatch/aw-server-rust.git", branch = "master" }
aw-server = { git = "https://github.com/ActivityWatch/aw-server-rust.git", branch = "master" }
anyhow = "1"
dirs = "6.0.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
log = "0.4.22"
fern = { version = "0.7", features = ["colored"] }
async-trait = "0.1"
umya-spreadsheet = "2"
